<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To do list</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <h1>TO DO LIST</h1>
    <form class="container"> 
        <div class="inputBox"><input type="text" id="text"><button id="addBtn">Add</button><input type="datetime-local" id="dateInput"></div>
        </div>
        
        <div class="controls-panel">
            <input type="text" id="searchInput" placeholder="🔍 Task axtar...">
            <div class="filter-sort-row">
                <button type="button" class="filter-btn active" data-filter="all">Hamısı</button>
                <button type="button" class="filter-btn" data-filter="active">Aktiv</button>
                <button type="button" class="filter-btn" data-filter="completed">Tamamlanmış</button>
                <button type="button" class="filter-btn" data-filter="overdue">Gecikənlər</button>
        
                <select id="sortSelect">
                    <option value="deadline-asc">📅 Yaxından-Uzağa</option>
                    <option value="deadline-desc">📅 Uzaqdan-Yaxına</option>
                    <option value="created-desc">🆕 Ən yeni</option>
                </select>
            </div>
            <ul id="list"></ul>
        </div>
    </form>
    <script src="script.js"></script>
</body>
</html>
